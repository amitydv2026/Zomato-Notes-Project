<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zomato Notes — Sign In</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-page">

  <div class="auth-wrapper">

    <!-- Brand -->
    <div class="auth-brand">
      <span class="auth-logo">📝</span>
      <h1 class="auth-title">Zomato Notes</h1>
      <p class="auth-tagline">AI-Augmented Internal Knowledge Base</p>
    </div>

    <!-- Card -->
    <div class="auth-card">

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" type="button">Sign In</button>
        <button class="auth-tab" id="tab-signup" type="button">Sign Up</button>
      </div>

      <!-- ── Login Form ──────────────────────────────────────── -->
      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="alice@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="login-password" placeholder="Your password" required autocomplete="current-password" />
            <button type="button" class="toggle-pw" data-target="login-password"></button>
          </div>
        </div>
        <div id="login-error" class="error-message" role="alert"></div>
        <div id="login-success" class="success-message" role="status" style="display:none"></div>
        <button type="submit" class="btn-auth" id="login-btn">Sign In</button>
        <p class="auth-switch-hint">Don't have an account? <a href="#" id="goto-signup">Sign up here</a></p>
      </form>

      <!-- ── Signup Form ─────────────────────────────────────── -->
      <form id="signup-form" class="auth-form hidden" novalidate>
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="signup-password">Password <span class="hint-text">(min 8 chars)</span></label>
          <div class="password-wrap">
            <input type="password" id="signup-password" placeholder="Create a password" required autocomplete="new-password" />
            <button type="button" class="toggle-pw" data-target="signup-password">👁</button>
          </div>
        </div>
        <div id="signup-error" class="error-message" role="alert"></div>
        <button type="submit" class="btn-auth" id="signup-btn">Create Account</button>
        <p class="auth-switch-hint">Already have an account? <a href="#" id="goto-login">Sign in here</a></p>
      </form>

    </div><!-- /.auth-card -->

  </div><!-- /.auth-wrapper -->

  <script src="auth.js"></script>
</body>
</html>
