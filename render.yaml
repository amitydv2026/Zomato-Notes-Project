services:
  - type: web
    name: zomato-notes-backend
    runtime: python
    rootDir: backend
    # Note: rootDir is relative to the repo root.
    # Since this render.yaml sits at repo root alongside /backend, this is correct.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free

    envVars:
      # ── Set these in the Render dashboard (do NOT commit real values) ──────
      - key: DATABASE_URL
        sync: false          # paste your Supabase connection string in Render UI

      - key: SECRET_TOKEN
        sync: false          # kept for reference; no longer used for auth

      # ── JWT Authentication ─────────────────────────────────────────────────
      - key: JWT_SECRET_KEY
        sync: false          # generate with: openssl rand -hex 32

      - key: JWT_ALGORITHM
        value: "HS256"

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"        # 24 hours

      # ── CORS: add your GitHub Pages URL here after deploying frontend ──────
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. https://yourusername.github.io

      # ── AI service ────────────────────────────────────────────────────────
      - key: MOCK_AI
        value: "0"           # 0 = real Groq LLM, 1 = offline mock

      - key: AI_API_KEY
        sync: false          # paste your Groq API key in Render UI

      # ── Email — Password Reset ─────────────────────────────────────────────
      # Leave SMTP_HOST blank → reset link is printed to Render logs (console mode)
      # For real email, sign up free at https://app.brevo.com → SMTP & API → SMTP
      - key: SMTP_HOST
        sync: false          # e.g. smtp-relay.brevo.com

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USER
        sync: false          # your Brevo login email

      - key: SMTP_PASSWORD
        sync: false          # your Brevo SMTP key (not login password)

      - key: EMAIL_FROM
        sync: false          # e.g. noreply@yourdomain.com

      - key: FRONTEND_URL
        value: "https://amitydv2026.github.io/Zomato-Notes-Project"
