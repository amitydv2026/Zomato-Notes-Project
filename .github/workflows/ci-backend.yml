name: Backend Tests

# Runs the pytest suite on every push to main and on pull requests,
# so a failing test blocks a bad merge before it reaches Render.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          # conftest.py sets these via os.environ too, but stating them
          # explicitly keeps the test run offline and DB-free.
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_TOKEN: "test-secret"
          MOCK_AI: "1"
          AI_API_KEY: "test-key"
          JWT_SECRET_KEY: "test-jwt-secret"
          JWT_ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
        run: pytest -v
